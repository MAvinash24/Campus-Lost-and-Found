sonar.projectKey=College-Lost-and-Found
sonar.projectName=College Lost and Found 20CYS401
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8
sonar.working.directory=.scannerwork
sonar.sources=app.py,wsgi.py,schema.sql,templates,static,deploy,Dockerfile,compose.yaml,scripts
sonar.tests=tests
sonar.exclusions=tests/.tmp/**,**/__pycache__/**
sonar.test.exclusions=tests/.tmp/**,**/__pycache__/**
sonar.python.version=3.12
sonar.python.coverage.reportPaths=.sonar-evidence/coverage.xml
sonar.coverage.exclusions=scripts/**,wsgi.py
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
