<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1800" viewBox="0 0 2400 1800"><rect width="2400" height="1800" fill="white"/><text x="90" y="86.32" text-anchor="start" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#16324F">Architecture | Security controls by layer</text><text x="90" y="149.18" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#587086">Implementation view  /  Browser -&gt; Caddy -&gt; Gunicorn / Flask -&gt; private SQLite</text><text x="90" y="1752.82" text-anchor="start" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#587086">COLLEGE LOST AND FOUND  /  SECURE SOFTWARE ENGINEERING</text><rect x="90" y="300" width="400" height="190" fill="#E5F5F2" stroke="#16324F" stroke-width="3"/><text x="290.0" y="351.18" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#20364B">Browser</text><text x="115" y="408.5" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">Server-rendered forms</text><text x="115" y="444.5" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">Student / Faculty / Admin</text><rect x="750" y="300" width="440" height="190" fill="#EAF3FC" stroke="#16324F" stroke-width="3"/><text x="970.0" y="351.52" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#20364B">Caddy TLS proxy</text><text x="775" y="408.84" text-anchor="start" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364B">HTTPS :8443</text><text x="775" y="445.84" text-anchor="start" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364B">Internal HTTP :8080</text><rect x="1360" y="230" width="940" height="1110" fill="#FFFFFF" stroke="#587086" stroke-width="3" stroke-dasharray="12 9"/><text x="1380" y="268.5" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#587086">Application runtime  /  non-root UID 10001</text><rect x="1440" y="330" width="780" height="210" fill="#EAF3FC" stroke="#16324F" stroke-width="3"/><text x="1830.0" y="381.86" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#20364B">Request and response security</text><text x="1465" y="439.18" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#20364B">Trusted hosts | session lookup | CSRF</text><text x="1465" y="477.18" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#20364B">CSP | output escaping | secure cookies</text><rect x="1440" y="710" width="780" height="210" fill="#E5F5F2" stroke="#16324F" stroke-width="3"/><text x="1830.0" y="761.86" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#20364B">Flask route and policy layer</text><text x="1465" y="819.18" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#20364B">Identity | reports | contact | recovery</text><text x="1465" y="857.18" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#20364B">Admin moderation | participant inbox</text><rect x="1440" y="1090" width="780" height="175" fill="#EAF3FC" stroke="#16324F" stroke-width="3"/><text x="1830.0" y="1141.52" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#20364B">Database access layer</text><text x="1465" y="1198.84" text-anchor="start" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364B">Parameterized SQL | bounded queries</text><text x="1465" y="1235.84" text-anchor="start" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364B">Foreign keys | constrained report states</text><rect x="700" y="1080" width="510" height="240" fill="#FFF3D9" stroke="#16324F" stroke-width="3"/><text x="955.0" y="1131.18" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#20364B">Private SQLite persistence</text><text x="725" y="1188.5" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">Users | reports | messages</text><text x="725" y="1224.5" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">Audit events | login attempts</text><text x="725" y="1260.5" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">Docker volume / Kubernetes PVC</text><polyline points="712,1080 712,1320" fill="none" stroke="#16324F" stroke-width="3"/><polyline points="490,395.0 750,395.0" fill="none" stroke="#16324F" stroke-width="3"/><polygon points="750,395.0 732.8915050552991,403.26434514811336 732.8915050552991,386.73565485188664" fill="#16324F" stroke="#16324F"/><rect x="573" y="342" width="94" height="26" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/><text x="620" y="363.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">HTTPS</text><polyline points="1190,395.0 1440,435.0" fill="none" stroke="#16324F" stroke-width="3"/><polygon points="1440,435.0 1421.800688909392,440.4575705059366 1424.4120649719298,424.1364701150749" fill="#16324F" stroke="#16324F"/><rect x="1216" y="332" width="168" height="26" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/><text x="1300" y="353.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">Internal HTTP</text><polyline points="1830.0,540 1830.0,710" fill="none" stroke="#16324F" stroke-width="3"/><polygon points="1830.0,710 1821.7356548518867,692.8915050552991 1838.2643451481133,692.8915050552991" fill="#16324F" stroke="#16324F"/><rect x="1701" y="612" width="257" height="26" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/><text x="1830" y="633.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">Authenticated context</text><polyline points="1830.0,920 1830.0,1090" fill="none" stroke="#16324F" stroke-width="3"/><polygon points="1830.0,1090 1821.7356548518867,1072.8915050552991 1838.2643451481133,1072.8915050552991" fill="#16324F" stroke="#16324F"/><rect x="1682" y="997" width="296" height="31" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/><text x="1830" y="1018.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">Policy-checked operation</text><polyline points="1440,1177.5 1210,1200.0" fill="none" stroke="#16324F" stroke-width="3"/><polygon points="1210,1200.0 1226.2225866130875,1190.1092121860352 1227.8318418019237,1206.5593763385834" fill="#16324F" stroke="#16324F"/><rect x="1237" y="1087" width="146" height="26" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/><text x="1310" y="1108.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">Read / write</text><rect x="90" y="650" width="1120" height="280" fill="#E5F5F2" stroke="#16324F" stroke-width="3"/><text x="650.0" y="701.52" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#20364B">Policies on the highest-risk paths</text><text x="115" y="758.84" text-anchor="start" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364B">Recovery: creator ID + open / verified state</text><text x="115" y="795.84" text-anchor="start" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364B">Moderation: administrator guard</text><text x="115" y="832.84" text-anchor="start" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364B">Inbox: sender / recipient scope; replies: recipient only</text><text x="115" y="869.84" text-anchor="start" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364B">Identity: scrypt + atomic login throttling</text><text x="100" y="1459.52" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#20364B">Docker: read-only root filesystem, dropped capabilities, runtime secret, health checks and resource limits.</text><text x="100" y="1529.52" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#20364B">Kubernetes: one replica / Recreate, restricted namespace, Secret, PVC, ClusterIP and RuntimeDefault seccomp.</text><text x="100" y="1599.18" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#20364B">Operator-managed: volume permissions, backups and trusted TLS certificates. NetworkPolicy enforcement needs verification.</text><text x="100" y="1669.18" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#20364B">Signed Flask session cookies are not encrypted; private records remain server-side.</text></svg>