  id</text><text x="1785" y="395.84" text-anchor="start" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364B">FK  report_id -&gt; REPORT.id</text><text x="1785" y="432.84" text-anchor="start" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364B">FK  sender_id -&gt; USER.id</text><text x="1785" y="469.84" text-anchor="start" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364B">FK  recipient_id -&gt; USER.id</text><text x="1785" y="506.84" text-anchor="start" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364B">body</text><text x="1785" y="543.84" text-anchor="start" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364B">created_at</text><rect x="90" y="1260" width="780" height="330" fill="#FFF3D9" stroke="#16324F" stroke-width="3"/><text x="480.0" y="1311.86" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#20364B">AUDIT_EVENT</text><text x="115" y="1369.18" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#20364B">PK  id</text><text x="115" y="1407.18" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#20364B">FK  actor_id -&gt; USER.id  NULL</text><text x="115" y="1445.18" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#20364B">event, object_id (logical reference)</text><text x="115" y="1483.18" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#20364B">outcome, created_at</text><rect x="1480" y="1260" width="830" height="330" fill="#FFF3D9" stroke="#16324F" stroke-width="3"/><text x="1895.0" y="1311.86" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#20364B">LOGIN_ATTEMPT</text><text x="1505" y="1369.18" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#20364B">PK  id</text><text x="1505" y="1407.18" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#20364B">email (may be an unknown login identifier)</text><text x="1505" y="1445.18" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#20364B">source (keyed source hash)</text><text x="1505" y="1483.18" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#20364B">created_at; no USER foreign key</text><polyline points="690,360 900,360" fill="none" stroke="#16324F" stroke-width="3"/><polygon points="900,360 882.8915050552991,368.26434514811336 882.8915050552991,351.73565485188664" fill="#16324F" stroke="#16324F"/><rect x="747" y="277" width="95" height="26" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/><text x="795" y="298.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">creates</text><rect x="748" y="311" width="93" height="26" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/><text x="795" y="332.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">1 : 0..N</text><polyline points="690,540 805,540 805,620 900,620" fill="none" stroke="#16324F" stroke-width="3"/><polygon points="900,620 882.8915050552991,628.2643451481134 882.8915050552991,611.7356548518866" fill="#16324F" stroke="#16324F"/><rect x="729" y="452" width="131" height="26" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/><text x="795" y="473.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">moderates</text><rect x="734" y="486" width="121" height="26" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/><text x="795" y="507.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">0..1 : 0..N</text><polyline points="1550,430 1760,430" fill="none" stroke="#16324F" stroke-width="3"/><polygon points="1760,430 1742.8915050552991,438.26434514811336 1742.8915050552991,421.73565485188664" fill="#16324F" stroke="#16324F"/><rect x="1628" y="332" width="53" height="26" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/><text x="1655" y="353.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">has</text><rect x="1608" y="366" width="93" height="26" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/><text x="1655" y="387.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">1 : 0..N</text><polyline points="390,710 390,1070 2035,1070 2035,720" fill="none" stroke="#16324F" stroke-width="3"/><polygon points="2035,720 2043.2643451481133,737.1084949447009 2026.7356548518867,737.1084949447009" fill="#16324F" stroke="#16324F"/><rect x="1352" y="1027" width="175" height="26" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/><text x="1440" y="1048.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">sends  1 : 0..N</text><polyline points="550,710 550,1160 2190,1160 2190,720" fill="none" stroke="#16324F" stroke-width="3"/><polygon points="2190,720 2198.2643451481135,737.1084949447009 2181.7356548518865,737.1084949447009" fill="#16324F" stroke="#16324F"/><rect x="1329" y="1117" width="202" height="26" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/><text x="1430" y="1138.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">receives  1 : 0..N</text><polyline points="215,710 215,1260" fill="none" stroke="#16324F" stroke-width="3"/><polygon points="215,1260 206.73565485188664,1242.8915050552991 223.26434514811336,1242.8915050552991" fill="#16324F" stroke="#16324F"/><rect x="169" y="907" width="111" height="31" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/><text x="225" y="928.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">performs</text><rect x="164" y="941" width="121" height="26" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/><text x="225" y="962.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">0..1 : 0..N</text><text x="100" y="1699.86" text-anchor="start" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#20364B">Every report has one reporter and an optional moderator. Every message has one report, sender and recipient.</text><text x="100" y="1759.86" text-anchor="start" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#20364B">Cardinalities read as parent participation : number of child records. Login attempts are independent records.</text></svg>