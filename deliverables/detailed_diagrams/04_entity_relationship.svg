<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1900" viewBox="0 0 2400 1900"><rect width="2400" height="1900" fill="white"/><text x="90" y="86.32" text-anchor="start" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#16324F">Entity relationships | Implemented SQLite schema</text><text x="90" y="149.18" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#587086">Primary keys, foreign keys and cardinalities  /  Each connecting role is shown separately</text><text x="90" y="1852.82" text-anchor="start" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#587086">COLLEGE LOST AND FOUND  /  SECURE SOFTWARE ENGINEERING</text><rect x="90" y="250" width="600" height="460" fill="#EAF3FC" stroke="#16324F" stroke-width="3"/><text x="390.0" y="301.86" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#20364B">USER</text><text x="115" y="359.18" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#20364B">PK  id</text><text x="115" y="397.18" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#20364B">name</text><text x="115" y="435.18" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#20364B">email  UNIQUE, NOT NULL</text><text x="115" y="473.18" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#20364B">password_hash</text><text x="115" y="511.18" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#20364B">role: student | faculty | administrator</text><text x="115" y="549.18" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#20364B">created_at</text><rect x="900" y="250" width="650" height="735" fill="#E5F5F2" stroke="#16324F" stroke-width="3"/><text x="1225.0" y="301.52" text-anchor="middle" font-family="Arial,s