<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1550" viewBox="0 0 2400 1550"><rect width="2400" height="1550" fill="white"/><text x="90" y="86.32" text-anchor="start" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#16324F">State model | Moderation and recovery lifecycle</text><text x="90" y="149.18" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#587086">Two independent state fields  /  moderation: pending, verified, removed  /  status: open, recovered</text><text x="90" y="1502.82" text-anchor="start" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#587086">COLLEGE LOST AND FOUND  /  SECURE SOFTWARE ENGINEERING</text><rect x="100" y="430" width="610" height="230" fill="#FFF3D9" stroke="#16324F" stroke-width="3"/><text x="405.0" y="482.2" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#20364B">Created report</text><text x="125" y="539.52" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#20364B">moderation = pending</text><text x="125" y="578.52" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#20364B">status = open</text><text x="125" y="617.52" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#20364B">Owned by authenticated creator</text><rect x="900" y="430" width="610" height="230" fill="#EAF3FC" stroke="#16324F" stroke-width="3"/><text x="1205.0" y="482.2" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#20364B">Discoverable report</text><text x="925" y="539.52" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#20364B">moderation = verified</text><text x="925" y="578.52" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#20364B">status = open</text><text x="925" y="617.52" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#20364B">Private contact / reply allowed</text><rect x="1700" y="430" width="610" height="230" fill="#E5F5F2" stroke="#16324F" stroke-width="3"/><text x="2005.0" y="482.2" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#20364B">Recovered report</text><text x="1725" y="539.52" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#20364B">moderation = verified</text><text x="1725" y="578.52" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#20364B">status = recovered</text><text x="1725" y="617.52" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#20364B">Further contact / reply rejected</text><polyline points="710,545.0 900,545.0" fill="none" stroke="#16324F" stroke-width="3"/><polygon points="900,545.0 882.8915050552991,553.2643451481134 882.8915050552991,536.7356548518866" fill="#16324F" stroke="#16324F"/><rect x="679" y="397" width="250" height="26" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/><text x="805" y="418.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">Administrator verifies</text><polyline points="1510,545.0 1700,545.0" fill="none" stroke="#16324F" stroke-width="3"/><polygon points="1700,545.0 1682.8915050552991,553.2643451481134 1682.8915050552991,536.7356548518866" fill="#16324F" stroke="#16324F"/><rect x="1450" y="397" width="311" height="26" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/><text x="1605" y="418.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">Creator confirms handover</text><rect x="900" y="1000" width="610" height="210" fill="#FCEBEA" stroke="#16324F" stroke-width="3"/><text x="1205.0" y="1052.2" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#20364B">Removed report</text><text x="925" y="1109.52" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#20364B">moderation = removed</text><text x="925" y="1148.52" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#20364B">status preserved</text><text x="925" y="1187.52" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#20364B">Hidden from ordinary discovery</text><polyline points="405,660 405,1105 900,1105" fill="none" stroke="#16324F" stroke-width="3"/><polygon points="900,1105 882.8915050552991,1113.2643451481133 882.8915050552991,1096.7356548518867" fill="#16324F" stroke="#16324F"/><rect x="291" y="832" width="266" height="26" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/><text x="425" y="853.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">Administrator removes</text><rect x="326" y="866" width="198" height="31" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/><text x="425" y="887.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">Reason required</text><polyline points="1205,660 1205,1000" fill="none" stroke="#16324F" stroke-width="3"/><polygon points="1205,1000 1196.7356548518867,982.8915050552991 1213.2643451481133,982.8915050552991" fill="#16324F" stroke="#16324F"/><rect x="1276" y="807" width="266" height="26" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/><text x="1410" y="828.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">Administrator removes</text><polyline points="2005,660 2005,1105 1510,1105" fill="none" stroke="#16324F" stroke-width="3"/><polygon points="1510,1105 1527.1084949447009,1096.7356548518867 1527.1084949447009,1113.2643451481133" fill="#16324F" stroke="#16324F"/><rect x="1876" y="822" width="266" height="26" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/><text x="2010" y="843.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">Administrator removes</text><rect x="1839" y="856" width="342" height="31" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/><text x="2010" y="877.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">Status may remain recovered</text><text x="100" y="1349.52" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#20364B">The implementation permits later administrator moderation changes. Moderation does not transfer report ownership.</text><text x="100" y="1409.52" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#20364B">Recovery requires creator identity + verified + open. Repeated recovery is rejected; handover is an external action.</text></svg>