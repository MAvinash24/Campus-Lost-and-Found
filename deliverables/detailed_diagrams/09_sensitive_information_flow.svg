ion + reason</text><rect x="760" y="1220" width="700" height="170" fill="#FFF3D9" stroke="#16324F" stroke-width="3"/><text x="1110.0" y="1271.86" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#20364B">Administrator policy</text><text x="785" y="1329.18" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#20364B">Allowlisted action; reason bounds</text><rect x="1720" y="1220" width="590" height="170" fill="#FFF3D9" stroke="#16324F" stroke-width="3"/><text x="2015.0" y="1271.86" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#20364B">D2 Report + D4 Audit</text><text x="1745" y="1329.18" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#20364B">Visibility state; actor and outcome</text><polyline points="560,1305.0 760,1305.0" fill="none" stroke="#16324F" stroke-width="3"/><polygon points="760,1305.0 742.8915050552991,1313.2643451481133 742.8915050552991,1296.7356548518867" fill="#16324F" stroke="#16324F"/><rect x="631" y="1267" width="58" height="26" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/><text x="660" y="1288.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">TB1</text><polyline points="1460,1305.0 1720,1305.0" fill="none" stroke="#16324F" stroke-width="3"/><polygon points="1720,1305.0 1702.8915050552991,1313.2643451481133 1702.8915050552991,1296.7356548518867" fill="#16324F" stroke="#16324F"/><rect x="1496" y="1267" width="186" height="26" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/><text x="1590" y="1288.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">Authorized flow</text><text x="100" y="1599.52" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#20364B">Excluded from audit: passwords, session secrets and private message bodies. Public reports omit account emails.</text><text x="100" y="1659.52" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#20364B">SQLite files are private but not encrypted by the application; storage and backup protection belongs to the operator.</text></svg>