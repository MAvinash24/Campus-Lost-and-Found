<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1900" viewBox="0 0 2400 1900"><rect width="2400" height="1900" fill="white"/><text x="90" y="86.32" text-anchor="start" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#16324F">Sequence | Report, moderate and recover</text><text x="90" y="149.18" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#587086">Boundary-control-entity analysis  /  Report creation, administrator verification and creator confirmation</text><text x="90" y="1852.82" text-anchor="start" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#587086">COLLEGE LOST AND FOUND  /  SECURE SOFTWARE ENGINEERING</text><rect x="55" y="240" width="330" height="115" fill="#EAF3FC" stroke="#16324F" stroke-width="3"/><text x="220.0" y="291.18" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#20364B">Campus user</text><polyline points="220,355 220,1580" fill="none" stroke="#587086" stroke-width="3" stroke-dasharray="13 11"/><rect x="525" y="240" width="330" height="115" fill="#EAF3FC" stroke="#16324F" stroke-width="3"/><text x="690.0" y="291.18" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#20364B">Browser / forms</text><polyline points="690,355 690,1580" fill="none" stroke="#587086" stroke-width="3" stroke-dasharray="13 11"/><rect x="1045" y="240" width="330" height="115" fill="#EAF3FC" stroke="#16324F" stroke-width="3"/><text x="1210.0" y="291.18" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#20364B">Flask controls</text><polyline points="1210,355 1210,1580" fill="none" stroke="#587086" stroke-width="3" stroke-dasharray="13 11"/><rect x="1555" y="240" width="330" height="115" fill="#EAF3FC" stroke="#16324F" stroke-width="3"/><text x="1720.0" y="291.18" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#20364B">SQLite entities</text><polyline points="1720,355 1720,1580" fill="none" stroke="#587086" stroke-width="3" stroke-dasharray="13 11"/><rect x="2035" y="240" width="330" height="115" fill="#EAF3FC" stroke="#16324F" stroke-width="3"/><text x="2200.0" y="291.18" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#20364B">Administrator</text><polyline points="2200,355 2200,1580" fill="none" stroke="#587086" stroke-width="3" stroke-dasharray="13 11"/><polyline points="220,420 690,420" fill="none" stroke="#16324F" stroke-width="3"/><polygon points="690,420 672.8915050552991,428.26434514811336 672.8915050552991,411.73565485188664" fill="#16324F" stroke="#16324F"/><rect x="293.0" y="381" width="324.0" height="26" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/><text x="455.0" y="402.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">1 Submit lost / found details</text><polyline points="690,520 1210,520" fill="none" stroke="#16324F" stroke-width="3"/><polygon points="1210,520 1192.8915050552991,528.2643451481134 1192.8915050552991,511.73565485188664" fill="#16324F" stroke="#16324F"/><rect x="753.0" y="481" width="393.0" height="31" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/><text x="950.0" y="502.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">2 POST /report + session + CSRF</text><polyline points="1210,630 1720,630" fill="none" stroke="#16324F" stroke-width="3"/><polygon points="1720,630 1702.8915050552991,638.2643451481134 1702.8915050552991,621.7356548518866" fill="#16324F" stroke="#16324F"/><rect x="1226.0" y="591" width="479.0" height="31" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/><text x="1465.0" y="612.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">3 Validate; INSERT reporter-owned report</text><polyline points="1720,735 1210,735" fill="none" stroke="#16324F" stroke-width="3" stroke-dasharray="13 11"/><polygon points="1210,735 1227.1084949447009,726.7356548518866 1227.1084949447009,743.2643451481134" fill="#16324F" stroke="#16324F"/><rect x="1267.0" y="696" width="396.0" height="31" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/><text x="1465.0" y="717.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">4 Pending + open report reference</text><polyline points="1210,830 690,830" fill="none" stroke="#16324F" stroke-width="3" stroke-dasharray="13 11"/><polygon points="690,830 707.1084949447009,821.7356548518866 707.1084949447009,838.2643451481134" fill="#16324F" stroke="#16324F"/><rect x="796.0" y="791" width="308.0" height="31" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/><text x="950.0" y="812.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">5 Redirect to report details</text><polyline points="2200,950 1210,950" fill="none" stroke="#16324F" stroke-width="3"/><polygon points="1210,950 1227.1084949447009,941.7356548518866 1227.1084949447009,958.2643451481134" fill="#16324F" stroke="#16324F"/><rect x="1466.0" y="911" width="478.0" height="31" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/><text x="1705.0" y="932.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">6 POST moderation: verify + admin guard</text><polyline points="1210,1060 1720,1060" fill="none" stroke="#16324F" stroke-width="3"/><polygon points="1720,1060 1702.8915050552991,1068.2643451481133 1702.8915050552991,1051.7356548518867" fill="#16324F" stroke="#16324F"/><rect x="1246.0" y="1021" width="438.0" height="30" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/><text x="1465.0" y="1042.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">7 UPDATE moderation; audit decision</text><polyline points="220,1190 690,1190" fill="none" stroke="#16324F" stroke-width="3"/><polygon points="690,1190 672.8915050552991,1198.2643451481133 672.8915050552991,1181.7356548518867" fill="#16324F" stroke="#16324F"/><rect x="264.0" y="1151" width="382.0" height="30" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/><text x="455.0" y="1172.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">8 Confirm return; mark recovered</text><polyline points="690,1300 1210,1300" fill="none" stroke="#16324F" stroke-width="3"/><polygon points="1210,1300 1192.8915050552991,1308.2643451481133 1192.8915050552991,1291.7356548518867" fill="#16324F" stroke="#16324F"/><rect x="739.0" y="1261" width="421.0" height="26" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/><text x="950.0" y="1282.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">9 POST /items/&lt;id&gt;/recover + CSRF</text><polyline points="1210,1410 1720,1410" fill="none" stroke="#16324F" stroke-width="3"/><polygon points="1720,1410 1702.8915050552991,1418.2643451481133 1702.8915050552991,1401.7356548518867" fill="#16324F" stroke="#16324F"/><rect x="1246.0" y="1371" width="438.0" height="31" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/><text x="1465.0" y="1392.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">10 Check owner + state; update; audit</text><polyline points="1210,1515 690,1515" fill="none" stroke="#16324F" stroke-width="3" stroke-dasharray="13 11"/><polygon points="690,1515 707.1084949447009,1506.7356548518867 707.1084949447009,1523.2643451481133" fill="#16324F" stroke="#16324F"/><rect x="805.0" y="1476" width="291.0" height="26" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/><text x="950.0" y="1497.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">11 Show recovered state</text><text x="100" y="1659.86" text-anchor="start" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#20364B">Alternative paths: invalid input -&gt; form feedback; invalid CSRF -&gt; 400; another user recovery -&gt; 403.</text><text x="100" y="1719.86" text-anchor="start" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#20364B">Closed / unverified recovery -&gt; 409 when visible; hidden report -&gt; 404. No authorized update occurs.</text><text x="100" y="1779.86" text-anchor="start" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#20364B">Physical handover is confirmed by the creator; the application records the software workflow.</text></svg>