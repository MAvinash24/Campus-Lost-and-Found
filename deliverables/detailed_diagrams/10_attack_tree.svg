<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1900" viewBox="0 0 2400 1900"><rect width="2400" height="1900" fill="white"/><text x="90" y="86.32" text-anchor="start" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#16324F">Attack tree | Unauthorized report recovery</text><text x="90" y="149.18" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#587086">Threat model  /  Hypothetical attack prerequisites and controls; these are not demonstrated vulnerabilities</text><text x="90" y="1852.82" text-anchor="start" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#587086">COLLEGE LOST AND FOUND  /  SECURE SOFTWARE ENGINEERING</text><rect x="790" y="245" width="820" height="145" fill="#FCEBEA" stroke="#16324F" stroke-width="3"/><text x="1200.0" y="297.88" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#20364B">ROOT GOAL</text><text x="815" y="355.2" text-anchor="start" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#20364B">Mark another creator&#x27;s report recovered</text><text x="1200" y="455.88" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#20364B">OR</text><rect x="70" y="540" width="700" height="150" fill="#EAF3FC" stroke="#16324F" stroke-width="3"/><text x="420.0" y="591.52" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#20364B">A1 Compromise creator identity</text><text x="95" y="648.84" text-anchor="start" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364B">Both prerequisites required</text><polyline points="1200,390 1200,485 420,485 420,540" fill="none" stroke="#16324F" stroke-width="3"/><text x="420" y="770.2" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#20364B">AND</text><rect x="70" y="850" width="700" height="130" fill="#FCEBEA" stroke="#16324F" stroke-width="3"/><text x="420.0" y="901.52" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#20364B">A2 Steal password or session</text><rect x="70" y="1090" width="700" height="130" fill="#FCEBEA" stroke="#16324F" stroke-width="3"/><text x="420.0" y="1141.52" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#20364B">A3 Authenticate as report creator</text><polyline points="420,690 420,850" fill="none" stroke="#16324F" stroke-width="3"/><polyline points="420,760 810,760 810,1155 770,1155" fill="none" stroke="#16324F" stroke-width="3"/><rect x="70" y="1360" width="700" height="230" fill="#E5F5F2" stroke="#16324F" stroke-width="3"/><text x="420.0" y="1411.18" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#20364B">Prevent / detect</text><text x="95" y="1468.5" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">scrypt | TLS | HttpOnly cookies</text><text x="95" y="1504.5" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">Login throttling | denial audit</text><rect x="850" y="540" width="700" height="150" fill="#EAF3FC" stroke="#16324F" stroke-width="3"/><text x="1200.0" y="591.52" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#20364B">B1 Bypass recovery policy</text><text x="875" y="648.84" text-anchor="start" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364B">Both prerequisites required</text><polyline points="1200,390 1200,485 1200,485 1200,540" fill="none" stroke="#16324F" stroke-width="3"/><text x="1200" y="770.2" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#20364B">AND</text><rect x="850" y="850" width="700" height="130" fill="#FCEBEA" stroke="#16324F" stroke-width="3"/><text x="1200.0" y="901.52" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#20364B">B2 Choose a victim report ID</text><rect x="850" y="1090" width="700" height="130" fill="#FCEBEA" stroke="#16324F" stroke-width="3"/><text x="1200.0" y="1141.52" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#20364B">B3 Defeat owner + CSRF checks</text><polyline points="1200,690 1200,850" fill="none" stroke="#16324F" stroke-width="3"/><polyline points="1200,760 1590,760 1590,1155 1550,1155" fill="none" stroke="#16324F" stroke-width="3"/><rect x="850" y="1360" width="700" height="230" fill="#E5F5F2" stroke="#16324F" stroke-width="3"/><text x="1200.0" y="1411.18" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#20364B">Prevent / detect</text><text x="875" y="1468.5" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">Server-derived identity | creator check</text><text x="875" y="1504.5" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">State check | CSRF | bound SQL</text><rect x="1630" y="540" width="700" height="150" fill="#EAF3FC" stroke="#16324F" stroke-width="3"/><text x="1980.0" y="591.52" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#20364B">C1 Modify persistent data</text><text x="1655" y="648.84" text-anchor="start" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364B">Both prerequisites required</text><polyline points="1200,390 1200,485 1980,485 1980,540" fill="none" stroke="#16324F" stroke-width="3"/><text x="1980" y="770.2" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#20364B">AND</text><rect x="1630" y="850" width="700" height="130" fill="#FCEBEA" stroke="#16324F" stroke-width="3"/><text x="1980.0" y="901.52" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#20364B">C2 Obtain host / volume access</text><rect x="1630" y="1090" width="700" height="130" fill="#FCEBEA" stroke="#16324F" stroke-width="3"/><text x="1980.0" y="1141.52" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#20364B">C3 Write unauthorized state directly</text><polyline points="1980,690 1980,850" fill="none" stroke="#16324F" stroke-width="3"/><polyline points="1980,760 2370,760 2370,1155 2330,1155" fill="none" stroke="#16324F" stroke-width="3"/><rect x="1630" y="1360" width="700" height="230" fill="#E5F5F2" stroke="#16324F" stroke-width="3"/><text x="1980.0" y="1411.18" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#20364B">Prevent / detect</text><text x="1655" y="1468.5" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">Operator access controls | volume ACLs</text><text x="1655" y="1504.5" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364B">Backups | external integrity monitoring</text><text x="100" y="1709.52" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#20364B">OR: any complete branch can satisfy the root goal. AND: every prerequisite within that branch is needed.</text><text x="100" y="1769.52" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#20364B">Branches A/B have application controls. Branch C depends on privileged infrastructure access and operator controls.</text></svg>