" y="760.2" font-family="Arial,sans-serif" font-size="30" font-weight="400" text-anchor="middle" fill="black">Owner policy for recovery | Admin policy for moderation</text><text x="580.0" y="800.2" font-family="Arial,sans-serif" font-size="30" font-weight="400" text-anchor="middle" fill="black">Participant policy for inbox | scrypt + atomic throttling</text><text x="580.0" y="840.2" font-family="Arial,sans-serif" font-size="30" font-weight="400" text-anchor="middle" fill="black">Escaped output + strict CSP | secret outside image</text><text x="1100" y="1309.86" font-family="Arial,sans-serif" font-size="29" font-weight="400" text-anchor="middle" fill="black">Docker: non-root, read-only rootfs, dropped capabilities, health checks and resource limits.</text><text x="1100" y="1348.86" font-family="Arial,sans-serif" font-size="29" font-weight="400" text-anchor="middle" fill="black">Kubernetes: restricted namespace, ClusterIP, Secret, PVC, seccomp and NetworkPolicy.</text></svg>