<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1500" viewBox="0 0 2200 1500"><rect width="100%" height="100%" fill="white"/><text x="1100.0" y="69.28" font-family="Arial,sans-serif" font-size="42" font-weight="700" text-anchor="middle" fill="black">ER model  Keys relationships and cardinalities</text><text x="1100.0" y="1463.16" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="black">College Lost and Found  |  20CYS401  |  Marisetti Avinash  |  CH.SC.U4CYS23024</text><rect x="75" y="180" width="520" height="400" fill="white" stroke="black" stroke-width="3" /><text x="335.0" y="306.88" font-family="Arial,sans-serif" font-size="32" font-weight="400" text-anchor="middle" fill="black">USERS</text><text x="335.0" y="348.88" font-family="Arial,sans-serif" font-size="32" font-weight="400" text-anchor="middle" fill="black">PK id</text><text x="335.0" y="390.88" font-family="Arial,sans-serif" font-size="32" font-weight="400" text-anchor="middle" fill="black">name | UNIQUE email</text><text x="335.0" y="432.88" font-family="Arial,sans-serif" font-size="32" font-weight="400" text-anchor="middle" fill="black">password_hash | role</text><text x="335.0" y="474.88" font-family="Arial,sans-serif" font-size="32" font-weight="400" text-anchor="middle" fill="black">created_at</text><rect x="825" y="180" width="620" height="560" fill="white" stroke="black" stroke-width="3" /><text x="1135.0" y="330.2" font-family="Arial,sans-serif" font-size="30" font-weight="400" text-anchor="middle" fill="black">REPORTS</text><text x="1135.0" y="370.2" font-family="Arial,sans-serif" font-size="30" font-weight="400" text-anchor="middle" fill="black">PK id</text><text x="1135.0" y="410.2" font-family="Arial,sans-serif" font-size="30" font-weight="400" text-anchor="middle" fill="black">FK reporter_id → users.id</text><text x="1135.0" y="450.2" font-family="Arial,sans-serif" font-size="30" font-weight="400" text-anchor="middle" fill="black">FK moderator_id → users.id (nullable)</text><text x="1135.0" y="490.2" font-family="Arial,sans-serif" font-size="30" font-weight="400" text-anchor="middle" fill="black">kind | title | description | category</text><text x="1135.0" y="530.2" font-family="Arial,sans-serif" font-size="30" font-weight="400" text-anchor="middle" fill="black">location | item_date | status</text><text x="1135.0" y="570.2" font-family="Arial,sans-serif" font-size="30" font-weight="400" text-anchor="middle" fill="black">moderation | moderation_reason</text><text x="1135.0" y="610.2" font-family="Arial,sans-serif" font-size="30" font-weight="400" text-anchor="middle" fill="black">created_at | recovered_at</text><rect x="1680" y="180" width="450" height="480" fill="white" stroke="black" stroke-width="3" /><text x="1905.0" y="332.36" font-family="Arial,sans-serif" font-size="29" font-weight="400" text-anchor="middle" fill="black">MESSAGES</text><text x="1905.0" y="371.36" font-family="Arial,sans-serif" font-size="29" font-weight="400" text-anchor="middle" fill="black">PK id</text><text x="1905.0" y="410.36" font-family="Arial,sans-serif" font-size="29" font-weight="400" text-anchor="middle" fill="black">FK report_id → reports.id</text><text x="1905.0" y="449.36" font-family="Arial,sans-serif" font-size="29" font-weight="400" text-anchor="middle" fill="black">FK sender_id → users.id</text><text x="1905.0" y="488.36" font-family="Arial,sans-serif" font-size="29" font-weight="400" text-anchor="middle" fill="black">FK recipient_id → users.id</text><text x="1905.0" y="527.36" font-family="Arial,sans-serif" font-size="29" font-weight="400" text-anchor="middle" fill="black">body | created_at</text><rect x="75" y="900" width="640" height="310" fill="white" stroke="black" stroke-width="3" /><text x="395.0" y="1006.36" font-family="Arial,sans-serif" font-size="29" font-weight="400" text-anchor="middle" fill="black">AUDIT_EVENTS</text><text x="395.0" y="1045.36" font-family="Arial,sans-serif" font-size="29" font-weight="400" text-anchor="middle" fill="black">PK id | FK actor_id → users.id (nullable)</text><text x="395.0" y="1084.36" font-family="Arial,sans-serif" font-size="29" font-weight="400" text-anchor="middle" fill="black">event | object_id | outcome | created_at</text><text x="395.0" y="1123.36" font-family="Arial,sans-serif" font-size="29" font-weight="400" text-anchor="middle" fill="black">object_id is a logical reference</text><rect x="1320" y="920" width="760" height="250" fill="white" stroke="black" stroke-width="3" /><text x="1700.0" y="1015.2" font-family="Arial,sans-serif" font-size="30" font-weight="400" text-anchor="middle" fill="black">LOGIN_ATTEMPTS</text><text x="1700.0" y="1055.2" font-family="Arial,sans-serif" font-size="30" font-weight="400" text-anchor="middle" fill="black">PK id | email | source (keyed hash) | created_at</text><text x="1700.0" y="1095.2" font-family="Arial,sans-serif" font-size="30" font-weight="400" text-anchor="middle" fill="black">No user FK: includes unknown login identifiers</text><polyline points="595,380.0 825,460.0" fill="none" stroke="black" stroke-width="3" /><polygon points="825,460.0 808.231623366203,462.7967025346171 813.5866634030751,447.4009624286101" fill="black" stroke="black"/><rect x="580.0" y="294.0" width="259.0" height="32.0" fill="white"/><text x="710.0" y="316.16" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="black">1 reporter : 0..N reports</text><polyline points="1445,460.0 1680,420.0" fill="none" stroke="black" stroke-width="3" /><polygon points="1680,420.0 1666.6602330262003,430.53805565959493 1663.9250250704727,414.4687089196948" fill="black" stroke="black"/><rect x="1426.5" y="314.0" width="272.0" height="32.0" fill="white"/><text x="1562.5" y="336.16" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="black">1 report : 0..N messages</text><polyline points="335.0,580 660,580 660,790 1905,790 1905.0,660" fill="none" stroke="black" stroke-width="3" /><polygon points="1905.0,660 1913.1502341562714,674.9189035521364 1896.8497658437286,674.9189035521364" fill="black" stroke="black"/><rect x="979.0" y="764.0" width="282.0" height="32.0" fill="white"/><text x="1120.0" y="786.16" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="black">1 sender : 0..N messages</text><polyline points="335.0,580 710,580 710,860 2010,860 1905.0,660" fill="none" stroke="black" stroke-width="3" /><polygon points="1905.0,660 1919.151012336395,669.4206607971626 1904.718611877193,676.9976710382435" fill="black" stroke="black"/><rect x="970.0" y="834.0" width="299.0" height="32.0" fill="white"/><text x="1120.0" y="856.16" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="black">1 recipient : 0..N messages</text><polyline points="335.0,580 395.0,900" fill="none" stroke="black" stroke-width="3" /><polygon points="395.0,900 384.23997865062046,886.8386193520248 400.2612555890231,883.8346299260743" fill="black" stroke="black"/><rect x="389.0" y="704.0" width="252.0" height="27.0" fill="white"/><text x="515.0" y="726.16" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="black">0..1 actor : 0..N events</text><text x="1100" y="1240.2" font-family="Arial,sans-serif" font-size="30" font-weight="400" text-anchor="middle" fill="black">Each report has exactly 1 reporter and 0..1 moderator.</text><text x="1100" y="1280.2" font-family="Arial,sans-serif" font-size="30" font-weight="400" text-anchor="middle" fill="black">Each message has exactly 1 sender and 1 recipient.</text><text x="1100" y="1339.86" font-family="Arial,sans-serif" font-size="29" font-weight="400" text-anchor="middle" fill="black">SQLite enforces FK constraints and state enumerations.</text><text x="1100" y="1378.86" font-family="Arial,sans-serif" font-size="29" font-weight="400" text-anchor="middle" fill="black">Password hashes and emails are excluded from public report and inbox queries.</text></svg>