<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1450" viewBox="0 0 2200 1450"><rect width="100%" height="100%" fill="white"/><text x="1100.0" y="69.28" font-family="Arial,sans-serif" font-size="42" font-weight="700" text-anchor="middle" fill="black">Sensitive information flow and recipient constraints</text><text x="1100.0" y="1413.16" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="black">College Lost and Found  |  20CYS401  |  Marisetti Avinash  |  CH.SC.U4CYS23024</text><rect x="70" y="220" width="500" height="190" fill="#f2f2f2" stroke="black" stroke-width="3" /><text x="320.0" y="304.72" font-family="Arial,sans-serif" font-size="33" font-weight="400" text-anchor="middle" fill="black">A1 Credentials</text><text x="320.0" y="347.72" font-family="Arial,sans-serif" font-size="33" font-weight="400" text-anchor="middle" fill="black">Email + password</text><rect x="820" y="220" width="550" height="190" fill="white" stroke="black" stroke-width="3" /><text x="1095.0" y="305.04" font-family="Arial,sans-serif" font-size="31" font-weight="400" text-anchor="middle" fill="black">P1 TLS sign in / verification</text><text x="1095.0" y="346.04" font-family="Arial,sans-serif" font-size="31" font-weight="400" text-anchor="middle" fill="black">Password → scrypt comparison</text><rect x="1660" y="220" width="460" height="190" fill="white" stroke="black" stroke-width="3" /><text x="1890.0" y="305.04" font-family="Arial,sans-serif" font-size="31" font-weight="400" text-anchor="middle" fill="black">D1 Private user store</text><text x="1890.0" y="346.04" font-family="Arial,sans-serif" font-size="31" font-weight="400" text-anchor="middle" fill="black">Hash never in browser</text><rect x="70" y="600" width="500" height="190" fill="#f2f2f2" stroke="black" stroke-width="3" /><text x="320.0" y="684.72" font-family="Arial,sans-serif" font-size="33" font-weight="400" text-anchor="middle" fill="black">A3 Private message</text><text x="320.0" y="727.72" font-family="Arial,sans-serif" font-size="33" font-weight="400" text-anchor="middle" fill="black">Untrusted sender text</text><rect x="820" y="600" width="550" height="190" fill="white" stroke="black" stroke-width="3" /><text x="1095.0" y="685.04" font-family="Arial,sans-serif" font-size="31" font-weight="400" text-anchor="middle" fill="black">P3 Recipient policy</text><text x="1095.0" y="726.04" font-family="Arial,sans-serif" font-size="31" font-weight="400" text-anchor="middle" fill="black">Escaping + sender throttle</text><rect x="1660" y="600" width="460" height="190" fill="white" stroke="black" stroke-width="3" /><text x="1890.0" y="685.04" font-family="Arial,sans-serif" font-size="31" font-weight="400" text-anchor="middle" fill="black">D3 → Participant inbox</text><text x="1890.0" y="726.04" font-family="Arial,sans-serif" font-size="31" font-weight="400" text-anchor="middle" fill="black">No email disclosure</text><rect x="70" y="980" width="500" height="190" fill="#f2f2f2" stroke="black" stroke-width="3" /><text x="320.0" y="1064.88" font-family="Arial,sans-serif" font-size="32" font-weight="400" text-anchor="middle" fill="black">A4 Recovery decision</text><text x="320.0" y="1106.88" font-family="Arial,sans-serif" font-size="32" font-weight="400" text-anchor="middle" fill="black">Reporter-owned operation</text><rect x="820" y="980" width="550" height="190" fill="white" stroke="black" stroke-width="3" /><text x="1095.0" y="1065.04" font-family="Arial,sans-serif" font-size="31" font-weight="400" text-anchor="middle" fill="black">P3 Owner policy + CSRF</text><text x="1095.0" y="1106.04" font-family="Arial,sans-serif" font-size="31" font-weight="400" text-anchor="middle" fill="black">Open verified state required</text><rect x="1660" y="980" width="460" height="190" fill="white" stroke="black" stroke-width="3" /><text x="1890.0" y="1065.04" font-family="Arial,sans-serif" font-size="31" font-weight="400" text-anchor="middle" fill="black">D2 Updated state</text><text x="1890.0" y="1106.04" font-family="Arial,sans-serif" font-size="31" font-weight="400" text-anchor="middle" fill="black">D4 Audit metadata</text><polyline points="570,315.0 820,315.0" fill="none" stroke="black" stroke-width="3" /><polygon points="820,315.0 805.0810964478636,323.15023415627144 805.0810964478636,306.84976584372856" fill="black" stroke="black"/><rect x="610.0" y="279.0" width="170.0" height="32.0" fill="white"/><text x="695.0" y="301.16" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="black">Trust boundary</text><polyline points="1370,315.0 1660,315.0" fill="none" stroke="black" stroke-width="3" /><polygon points="1660,315.0 1645.0810964478637,323.15023415627144 1645.0810964478637,306.84976584372856" fill="black" stroke="black"/><rect x="1428.0" y="279.0" width="174.0" height="27.0" fill="white"/><text x="1515.0" y="301.16" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="black">Authorized flow</text><polyline points="570,695.0 820,695.0" fill="none" stroke="black" stroke-width="3" /><polygon points="820,695.0 805.0810964478636,703.1502341562715 805.0810964478636,686.8497658437285" fill="black" stroke="black"/><rect x="610.0" y="659.0" width="170.0" height="32.0" fill="white"/><text x="695.0" y="681.16" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="black">Trust boundary</text><polyline points="1370,695.0 1660,695.0" fill="none" stroke="black" stroke-width="3" /><polygon points="1660,695.0 1645.0810964478637,703.1502341562715 1645.0810964478637,686.8497658437285" fill="black" stroke="black"/><rect x="1428.0" y="659.0" width="174.0" height="27.0" fill="white"/><text x="1515.0" y="681.16" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="black">Authorized flow</text><polyline points="570,1075.0 820,1075.0" fill="none" stroke="black" stroke-width="3" /><polygon points="820,1075.0 805.0810964478636,1083.1502341562714 805.0810964478636,1066.8497658437286" fill="black" stroke="black"/><rect x="610.0" y="1039.0" width="170.0" height="32.0" fill="white"/><text x="695.0" y="1061.16" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="black">Trust boundary</text><polyline points="1370,1075.0 1660,1075.0" fill="none" stroke="black" stroke-width="3" /><polygon points="1660,1075.0 1645.0810964478637,1083.1502341562714 1645.0810964478637,1066.8497658437286" fill="black" stroke="black"/><rect x="1428.0" y="1039.0" width="174.0" height="27.0" fill="white"/><text x="1515.0" y="1061.16" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="black">Authorized flow</text><text x="1100" y="1320.2" font-family="Arial,sans-serif" font-size="30" font-weight="400" text-anchor="middle" fill="black">No credential values or message bodies enter the audit trail.</text><text x="1100" y="1360.2" font-family="Arial,sans-serif" font-size="30" font-weight="400" text-anchor="middle" fill="black">Local storage is private but not application-encrypted; operators must secure volumes and backups.</text></svg>