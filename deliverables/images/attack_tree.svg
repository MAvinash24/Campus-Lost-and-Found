<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1500" viewBox="0 0 2200 1500"><rect width="100%" height="100%" fill="white"/><text x="1100.0" y="69.28" font-family="Arial,sans-serif" font-size="42" font-weight="700" text-anchor="middle" fill="black">Attack tree  Modify another user’s recovery state</text><text x="1100.0" y="1463.16" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="black">College Lost and Found  |  24CYS401  |  Marisetti Avinash  |  CH.SC.U4CYS23024</text><rect x="680" y="160" width="830" height="140" fill="#f2f2f2" stroke="black" stroke-width="3" /><text x="1095.0" y="219.56" font-family="Arial,sans-serif" font-size="34" font-weight="400" text-anchor="middle" fill="black">ROOT  Unauthorized report recovery</text><text x="1095.0" y="263.56" font-family="Arial,sans-serif" font-size="34" font-weight="400" text-anchor="middle" fill="black">OR</text><rect x="80" y="460" width="610" height="130" fill="white" stroke="black" stroke-width="3" /><text x="385.0" y="515.04" font-family="Arial,sans-serif" font-size="31" font-weight="400" text-anchor="middle" fill="black">Compromise reporter identity</text><text x="385.0" y="556.04" font-family="Arial,sans-serif" font-size="31" font-weight="400" text-anchor="middle" fill="black">AND</text><polyline points="1095.0,300 385.0,460" fill="none" stroke="black" stroke-width="3" /><polygon points="385.0,460 397.7621891740343,448.7693932716811 401.34566994232483,464.67108918097034" fill="black" stroke="black"/><rect x="800" y="460" width="610" height="130" fill="white" stroke="black" stroke-width="3" /><text x="1105.0" y="515.04" font-family="Arial,sans-serif" font-size="31" font-weight="400" text-anchor="middle" fill="black">Bypass recovery authorization</text><text x="1105.0" y="556.04" font-family="Arial,sans-serif" font-size="31" font-weight="400" text-anchor="middle" fill="black">AND</text><polyline points="1095.0,300 1105.0,460" fill="none" stroke="black" stroke-width="3" /><polygon points="1105.0,460 1095.9350221501973,445.61854748008443 1112.2037465800092,444.60175220322117" fill="black" stroke="black"/><rect x="1520" y="460" width="610" height="130" fill="white" stroke="black" stroke-width="3" /><text x="1825.0" y="515.04" font-family="Arial,sans-serif" font-size="31" font-weight="400" text-anchor="middle" fill="black">Modify data outside the app</text><text x="1825.0" y="556.04" font-family="Arial,sans-serif" font-size="31" font-weight="400" text-anchor="middle" fill="black">AND</text><polyline points="1095.0,300 1825.0,460" fill="none" stroke="black" stroke-width="3" /><polygon points="1825.0,460 1808.6820945227855,464.7671753519978 1812.171958305525,448.84467184324836" fill="black" stroke="black"/><rect x="80" y="800" width="610" height="160" fill="white" stroke="black" stroke-width="3" /><text x="385.0" y="870.2" font-family="Arial,sans-serif" font-size="30" font-weight="400" text-anchor="middle" fill="black">Obtain password / session</text><text x="385.0" y="910.2" font-family="Arial,sans-serif" font-size="30" font-weight="400" text-anchor="middle" fill="black">AND authenticate as reporter</text><polyline points="385.0,590 385.0,800" fill="none" stroke="black" stroke-width="3" /><polygon points="385.0,800 376.84976584372856,785.0810964478636 393.15023415627144,785.0810964478636" fill="black" stroke="black"/><rect x="800" y="800" width="610" height="160" fill="white" stroke="black" stroke-width="3" /><text x="1105.0" y="870.2" font-family="Arial,sans-serif" font-size="30" font-weight="400" text-anchor="middle" fill="black">Choose victim report ID</text><text x="1105.0" y="910.2" font-family="Arial,sans-serif" font-size="30" font-weight="400" text-anchor="middle" fill="black">AND exploit missing owner check</text><polyline points="1105.0,590 1105.0,800" fill="none" stroke="black" stroke-width="3" /><polygon points="1105.0,800 1096.8497658437286,785.0810964478636 1113.1502341562714,785.0810964478636" fill="black" stroke="black"/><rect x="1520" y="800" width="610" height="160" fill="white" stroke="black" stroke-width="3" /><text x="1825.0" y="870.2" font-family="Arial,sans-serif" font-size="30" font-weight="400" text-anchor="middle" fill="black">Gain operator / volume access</text><text x="1825.0" y="910.2" font-family="Arial,sans-serif" font-size="30" font-weight="400" text-anchor="middle" fill="black">AND issue direct data write</text><polyline points="1825.0,590 1825.0,800" fill="none" stroke="black" stroke-width="3" /><polygon points="1825.0,800 1816.8497658437286,785.0810964478636 1833.1502341562714,785.0810964478636" fill="black" stroke="black"/><rect x="80" y="1110" width="610" height="170" fill="#f2f2f2" stroke="black" stroke-width="3" /><text x="385.0" y="1185.68" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="black">Prevent: scrypt, TLS, secure cookie, throttling</text><text x="385.0" y="1222.68" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="black">Detect: login denials and unusual sessions</text><rect x="800" y="1110" width="610" height="170" fill="#f2f2f2" stroke="black" stroke-width="3" /><text x="1105.0" y="1185.68" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="black">Prevent: reporter_id check + CSRF + SQL binding</text><text x="1105.0" y="1222.68" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="black">Detect: recovery_denied / item_recovered</text><rect x="1520" y="1110" width="610" height="170" fill="#f2f2f2" stroke="black" stroke-width="3" /><text x="1825.0" y="1185.68" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="black">Prevent: host RBAC, storage ACL, backups</text><text x="1825.0" y="1222.68" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="black">Detect: external audit export / integrity checks</text><text x="1100" y="1379.52" font-family="Arial,sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="black">OR: one branch can achieve the goal. AND: both prerequisites in that branch are required.</text></svg>