ight="400" text-anchor="middle" fill="black">P1 authenticates all protected routes. P1 P2 and P3 also append events to D4.</text><text x="1110" y="1597.52" font-family="Arial,sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="black">TB3 Operator → secrets / image / data volumes; operator access is controlled outside the application.</text></svg>