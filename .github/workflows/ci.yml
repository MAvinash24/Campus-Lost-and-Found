name: Secure build and package
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: |
          pip install --require-hashes -r requirements.lock
          pip install pip-audit==2.10.1 bandit==1.9.4
      - name: Unit integration system and fuzz tests
        run: python -m unittest discover -s tests -v
      - name: Project static check
        run: |
          python scripts/check_security.py
          bandit -r app.py wsgi.py scripts/bootstrap.py
      - name: Dependency vulnerability check
        run: pip-audit -r requirements.txt
      - name: Build container
        run: docker build -t campus-lost-found:${{ github.sha }} .
      - name: Package verified image
        run: docker save campus-lost-found:${{ github.sha }} -o campus-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: campus-verified-image
          path: campus-image.tar
